<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRB Platinum · Cronograma de Faturas</title>
<style>
  :root {
    --azul: #16345F; --azul-claro: #EAF1FA; --vermelho: #C41E3A;
    --verde: #2E9E63; --texto: #23324A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F4F7FB; color: var(--texto); padding: 20px 12px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header {
    background: #fff; border-radius: 16px; padding: 18px 20px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 1px 3px rgba(20,40,70,0.08); margin-bottom: 16px;
  }
  .icon {
    width: 42px; height: 42px; border-radius: 10px;
    background: linear-gradient(135deg, var(--vermelho), #8F1528);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 18px; flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; }
  header p { font-size: 12px; color: #6B7C93; margin: 4px 0 0; }
  .limite-disp { margin-left: auto; text-align: right; flex-shrink: 0; }
  .limite-disp .label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #8194AC; }
  .limite-disp .valor-disp { font-size: 18px; font-weight: 700; color: var(--verde); font-variant-numeric: tabular-nums; }

  .month { background: #fff; border-radius: 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(20,40,70,0.06); overflow: hidden; }
  .month-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; cursor: pointer; user-select: none; }
  .month-head:hover { background: var(--azul-claro); }
  .month-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .month-name { font-size: 14px; font-weight: 600; }
  .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; padding: 2px 7px; border-radius: 5px; font-weight: 600; }
  .tag-atual { background: #FFF1D6; color: #A9700A; }
  .tag-paga { background: #E1F5E9; color: var(--verde); }
  .month-count { font-size: 11px; color: #8194AC; }
  .month-total { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chev { font-size: 11px; color: #8194AC; margin-left: 6px; }

  .items { padding: 0 12px 12px; display: none; }
  .items.open { display: block; }
  .item { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; margin: 4px 0; background: var(--azul-claro); border-radius: 9px; }
  .item-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .desc { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .parc { font-size: 11px; color: #8194AC; flex-shrink: 0; }
  .valor { font-size: 13px; font-variant-numeric: tabular-nums; flex-shrink: 0; margin-left: 8px; }
  .paid .desc, .paid .valor { color: #9AA9BD; }

  footer { text-align: center; font-size: 11px; color: #8194AC; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="icon">B</div>
    <div>
      <h1>BRB Platinum · final 4016</h1>
      <p>Cronograma de parcelas · limite R$ 9.200,00</p>
    </div>
    <div class="limite-disp">
      <div class="label">Disponível</div>
      <div class="valor-disp" id="limiteDisp">R$ 0,00</div>
    </div>
  </header>
  <div id="months"></div>
  <footer>Faturas são pagas integrais no vencimento (dia 20) · toque no mês para expandir</footer>
</div>

<script>
// ================================================================
// PARA ATUALIZAR: peça a Claude a nova linha e cole aqui dentro do
// array COMPRAS (ou RECORRENTES para itens como anuidade), depois
// salve o commit no GitHub. Nada mais precisa mudar.
// ================================================================
const COMPRAS = [
  { id: "p1", desc: "SH Iguatemi POA", parcelas: 3, valor: 159.90, primeiraFatura: {m:7,y:2026} },
  { id: "p2", desc: "MercadoLivre*MercadoLi", parcelas: 10, valor: 225.50, primeiraFatura: {m:7,y:2026} },
  { id: "p3", desc: "EC *Evidency", parcelas: 7, valor: 271.32, primeiraFatura: {m:7,y:2026} },
  { id: "p4", desc: "Amanda Talita Cabelos", parcelas: 3, valor: 266.66, primeiraFatura: {m:8,y:2026} },
  { id: "p5", desc: "To Que To Estética", parcelas: 5, valor: 189.80, primeiraFatura: {m:8,y:2026} },
  { id: "p6", desc: "Pollyana Nails", parcelas: 1, valor: 180.00, primeiraFatura: {m:8,y:2026} },
  { id: "p7", desc: "Compra avulsa (fralda RN)", parcelas: 1, valor: 16.99, primeiraFatura: {m:8,y:2026} },
  { id: "p8", desc: "Compra mercado (parcelado loja)", parcelas: 3, valor: 70.06, primeiraFatura: {m:8,y:2026} },
  { id: "p9", desc: "Farmácia São João", parcelas: 1, valor: 33.89, primeiraFatura: {m:8,y:2026} },
  { id: "p10", desc: "Lauri R. da Silveira (à vista)", parcelas: 1, valor: 170.25, primeiraFatura: {m:8,y:2026} },
  { id: "p11", desc: "Dominguez e Kaefer", parcelas: 1, valor: 13.00, primeiraFatura: {m:8,y:2026} },
  { id: "p12", desc: "Compra 24/07 (sem estabelecimento)", parcelas: 1, valor: 208.98, primeiraFatura: {m:8,y:2026} },
  { id: "p13", desc: "Mercado Sulnorte", parcelas: 1, valor: 72.93, primeiraFatura: {m:8,y:2026} },
  { id: "p14", desc: "Parque das Cascatas", parcelas: 1, valor: 300.00, primeiraFatura: {m:8,y:2026} },
  { id: "p15", desc: "Sim Rede (conveniência)", parcelas: 1, valor: 43.18, primeiraFatura: {m:8,y:2026} },
  { id: "p16", desc: "Yoo Sushi", parcelas: 1, valor: 186.90, primeiraFatura: {m:8,y:2026} },
  { id: "p17", desc: "Leticia Oliveira Mras", parcelas: 1, valor: 194.90, primeiraFatura: {m:8,y:2026} },
  { id: "p18", desc: "Compra Mercado Livre Dia dos Pais", parcelas: 8, valor: 52.61, primeiraFatura: {m:8,y:2026} },
  { id: "p19", desc: "Compra Mercado Livre Dia dos Pais", parcelas: 8, valor: 15.02, primeiraFatura: {m:8,y:2026} },
];

const RECORRENTES = [
  { id: "a1", desc: "Anuidade adicional (cartão Rafaela)", valor: 24.50, totalParcelas: 12, parcelaNaFaturaAncora: 7, faturaAncora: {m:7,y:2026} },
  { id: "a2", desc: "Anuidade (cartão Marcos)", valor: 49.00, totalParcelas: 12, parcelaNaFaturaAncora: 8, faturaAncora: {m:7,y:2026} },
];

const LIMITE_TOTAL = 9200.00;
const DIA_VENCIMENTO = 20;
const MESES = ["", "Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

function addMonths(base, n) {
  let total = base.m - 1 + n;
  let ny = base.y + Math.floor(total/12);
  let nm = (total % 12) + 1;
  return { m: nm, y: ny };
}
function key(m,y) { return y + "-" + String(m).padStart(2,"0"); }
function fmt(v) { return v.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2}); }

function buildSchedule() {
  const rows = [];
  COMPRAS.forEach(function(p) {
    for (let i = 0; i < p.parcelas; i++) {
      const mf = addMonths(p.primeiraFatura, i);
      rows.push({ desc:p.desc, numero:i+1, total:p.parcelas, valor:p.valor, mes:mf.m, ano:mf.y, key:p.id+"-"+key(mf.m,mf.y) });
    }
  });
  RECORRENTES.forEach(function(r) {
    for (let n = r.parcelaNaFaturaAncora; n <= r.totalParcelas; n++) {
      const mf = addMonths(r.faturaAncora, n - r.parcelaNaFaturaAncora);
      rows.push({ desc:r.desc, numero:n, total:r.totalParcelas, valor:r.valor, mes:mf.m, ano:mf.y, key:r.id+"-"+key(mf.m,mf.y) });
    }
  });
  return rows;
}

function isFaturaPaga(mes, ano) {
  return new Date(ano, mes - 1, DIA_VENCIMENTO) < new Date();
}
function isFaturaAtual(mes, ano) {
  const venc = new Date(ano, mes - 1, DIA_VENCIMENTO);
  const anterior = new Date(mes === 1 ? ano - 1 : ano, mes === 1 ? 11 : mes - 2, DIA_VENCIMENTO);
  const hoje = new Date();
  return hoje >= anterior && hoje < venc;
}

function render() {
  const schedule = buildSchedule();
  const byMonth = {};
  schedule.forEach(function(r) {
    const k = key(r.mes, r.ano);
    if (!byMonth[k]) byMonth[k] = { mes:r.mes, ano:r.ano, items:[] };
    byMonth[k].items.push(r);
  });
  const months = Object.keys(byMonth).sort();

  let comprometido = 0;
  schedule.forEach(function(it){ if (!isFaturaPaga(it.mes, it.ano)) comprometido += it.valor; });
  document.getElementById("limiteDisp").textContent = "R$ " + fmt(LIMITE_TOTAL - comprometido);

  const container = document.getElementById("months");
  container.innerHTML = "";
  months.forEach(function(k) {
    const info = byMonth[k];
    const totalMes = info.items.reduce(function(s,it){ return s + it.valor; }, 0);
    const paga = isFaturaPaga(info.mes, info.ano);
    const atual = isFaturaAtual(info.mes, info.ano);
    const primeiraAberta = !paga && k === months.find(function(m){ return !isFaturaPaga(byMonth[m].mes, byMonth[m].ano); });

    const monthDiv = document.createElement("div");
    monthDiv.className = "month";
    const head = document.createElement("div");
    head.className = "month-head";
    head.innerHTML =
      '<div class="month-left">' +
        '<span class="month-name">' + MESES[info.mes] + '/' + info.ano + '</span>' +
        (atual ? '<span class="tag tag-atual">atual</span>' : '') +
        (paga ? '<span class="tag tag-paga">paga</span>' : '') +
        '<span class="month-count">' + info.items.length + ' item(ns)</span>' +
      '</div>' +
      '<div style="display:flex;align-items:center;">' +
        '<span class="month-total">R$ ' + fmt(totalMes) + '</span>' +
        '<span class="chev">▾</span>' +
      '</div>';
    head.onclick = function() { itemsDiv.classList.toggle("open"); };

    const itemsDiv = document.createElement("div");
    itemsDiv.className = "items" + (atual || primeiraAberta ? " open" : "");
    info.items.forEach(function(it) {
      const row = document.createElement("div");
      row.className = "item" + (paga ? " paid" : "");
      row.innerHTML =
        '<div class="item-left">' +
          '<span class="desc">' + it.desc + '</span>' +
          '<span class="parc">' + it.numero + '/' + it.total + '</span>' +
        '</div>' +
        '<span class="valor">R$ ' + fmt(it.valor) + '</span>';
      itemsDiv.appendChild(row);
    });

    monthDiv.appendChild(head);
    monthDiv.appendChild(itemsDiv);
    container.appendChild(monthDiv);
  });
}

render();
</script>
</body>
</html>
