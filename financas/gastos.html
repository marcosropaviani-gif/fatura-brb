<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gastos Gerais · Sistema Paviani</title>
<style>
  :root {
    --azul: #16345F; --azul-claro: #EAF1FA; --verde: #2E9E63; --texto: #23324A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F4F7FB; color: var(--texto); padding: 20px 12px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .breadcrumb { font-size: 12px; color: #6B7C93; margin-bottom: 12px; }
  .breadcrumb a { color: #16345F; text-decoration: none; font-weight: 600; }
  .breadcrumb a:hover { text-decoration: underline; }

  header {
    background: #fff; border-radius: 16px; padding: 18px 20px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 1px 3px rgba(20,40,70,0.08); margin-bottom: 16px;
  }
  .icon {
    width: 42px; height: 42px; border-radius: 10px;
    background: linear-gradient(135deg, #2E86AB, #1B5A78);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 18px; flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; }
  header p { font-size: 12px; color: #6B7C93; margin: 4px 0 0; }
  .total-mes { margin-left: auto; text-align: right; flex-shrink: 0; }
  .total-mes .label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #8194AC; }
  .total-mes .valor { font-size: 18px; font-weight: 700; color: var(--azul); font-variant-numeric: tabular-nums; }

  .cat {
    background: #fff; border-radius: 14px; margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(20,40,70,0.06); overflow: hidden;
  }
  .cat-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; cursor: pointer; user-select: none; }
  .cat-head:hover { background: var(--azul-claro); }
  .cat-left { display: flex; align-items: center; gap: 8px; }
  .cat-name { font-size: 14px; font-weight: 600; }
  .cat-count { font-size: 11px; color: #8194AC; }
  .cat-total { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chev { font-size: 11px; color: #8194AC; margin-left: 6px; }

  .items { padding: 0 12px 12px; display: none; }
  .items.open { display: block; }
  .item { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; margin: 4px 0; background: var(--azul-claro); border-radius: 9px; }
  .item-left { display: flex; flex-direction: column; min-width: 0; }
  .desc { font-size: 13px; }
  .data { font-size: 11px; color: #8194AC; }
  .valor { font-size: 13px; font-variant-numeric: tabular-nums; flex-shrink: 0; margin-left: 8px; }

  .vazio { background: #fff; border-radius: 14px; padding: 28px 20px; text-align: center; color: #8194AC; font-size: 13px; box-shadow: 0 1px 2px rgba(20,40,70,0.06); }

  footer { text-align: center; font-size: 11px; color: #8194AC; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="breadcrumb"><a href="../index.html">Sistema Paviani</a> / <a href="index.html">Finanças</a> / Gastos Gerais</div>
  <header>
    <div class="icon">📊</div>
    <div>
      <h1>Gastos Gerais</h1>
      <p>Despesas registradas por categoria</p>
    </div>
    <div class="total-mes">
      <div class="label">Total</div>
      <div class="valor" id="totalGeral">R$ 0,00</div>
    </div>
  </header>
  <div id="categorias"></div>
  <footer>Registrado via conversa com Claude · toque na categoria para expandir</footer>
</div>

<script>
// ================================================================
// Cada gasto: { id, desc, categoria, valor, dataHora (ISO) }
// Categorias sugeridas: Alimentação, Transporte, Saúde, Casa,
// Lazer, Filippo, Educação, Outros — mas qualquer texto funciona.
// Para atualizar: adicione um item ao array GASTOS e comite.
// ================================================================
const GASTOS = [
];

function fmt(v) { return v.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtData(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
}

function render() {
  const container = document.getElementById("categorias");
  container.innerHTML = "";

  if (GASTOS.length === 0) {
    container.innerHTML = '<div class="vazio">Nenhum gasto registrado ainda.<br>Conte um gasto pra Claude na conversa que ele aparece aqui.</div>';
    document.getElementById("totalGeral").textContent = "R$ 0,00";
    return;
  }

  const porCategoria = {};
  let totalGeral = 0;
  GASTOS.forEach(function(g) {
    if (!porCategoria[g.categoria]) porCategoria[g.categoria] = [];
    porCategoria[g.categoria].push(g);
    totalGeral += g.valor;
  });

  document.getElementById("totalGeral").textContent = "R$ " + fmt(totalGeral);

  const categoriasOrdenadas = Object.keys(porCategoria).sort(function(a, b) {
    const totalA = porCategoria[a].reduce(function(s, g){ return s + g.valor; }, 0);
    const totalB = porCategoria[b].reduce(function(s, g){ return s + g.valor; }, 0);
    return totalB - totalA;
  });

  categoriasOrdenadas.forEach(function(cat, idx) {
    const items = porCategoria[cat].slice().sort(function(a,b){ return new Date(b.dataHora) - new Date(a.dataHora); });
    const total = items.reduce(function(s, g){ return s + g.valor; }, 0);

    const catDiv = document.createElement("div");
    catDiv.className = "cat";
    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML =
      '<div class="cat-left">' +
        '<span class="cat-name">' + cat + '</span>' +
        '<span class="cat-count">' + items.length + ' item(ns)</span>' +
      '</div>' +
      '<div style="display:flex;align-items:center;">' +
        '<span class="cat-total">R$ ' + fmt(total) + '</span>' +
        '<span class="chev">▾</span>' +
      '</div>';
    head.onclick = function() { itemsDiv.classList.toggle("open"); };

    const itemsDiv = document.createElement("div");
    itemsDiv.className = "items" + (idx === 0 ? " open" : "");
    items.forEach(function(g) {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML =
        '<div class="item-left">' +
          '<span class="desc">' + g.desc + '</span>' +
          '<span class="data">' + fmtData(g.dataHora) + '</span>' +
        '</div>' +
        '<span class="valor">R$ ' + fmt(g.valor) + '</span>';
      itemsDiv.appendChild(row);
    });

    catDiv.appendChild(head);
    catDiv.appendChild(itemsDiv);
    container.appendChild(catDiv);
  });
}

render();
</script>
</body>
</html>
