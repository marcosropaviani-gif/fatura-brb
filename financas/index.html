<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanças · Sistema Paviani</title>
<style>
  :root {
    --azul: #16345F; --azul-claro: #EAF1FA; --vermelho: #C41E3A;
    --verde: #2E9E63; --texto: #23324A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F4F7FB; color: var(--texto); padding: 24px 16px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .breadcrumb { font-size: 12px; color: #6B7C93; margin-bottom: 16px; }
  .breadcrumb a { color: #16345F; text-decoration: none; font-weight: 600; }
  .breadcrumb a:hover { text-decoration: underline; }
  h1 { font-size: 20px; margin: 0 0 20px; }

  .card {
    display: flex; align-items: center; gap: 16px;
    background: #fff; border-radius: 18px; padding: 20px;
    box-shadow: 0 1px 3px rgba(20,40,70,0.08);
    text-decoration: none; color: inherit; margin-bottom: 14px;
  }
  .card:active { opacity: .85; }
  .card .emoji {
    width: 52px; height: 52px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; flex-shrink: 0;
  }
  .card.cartao .emoji { background: linear-gradient(135deg, var(--vermelho), #8F1528); }
  .card.gastos .emoji { background: linear-gradient(135deg, #2E86AB, #1B5A78); }
  .card h2 { font-size: 16px; margin: 0 0 3px; }
  .card p { font-size: 12.5px; color: #6B7C93; margin: 0; line-height: 1.4; }
  .chev { margin-left: auto; color: #B8C7DB; font-size: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="breadcrumb"><a href="../index.html">Sistema Paviani</a> / Finanças</div>
  <h1>Finanças</h1>

  <a class="card cartao" href="cartao.html">
    <div class="emoji">💳</div>
    <div>
      <h2>Cartão BRB</h2>
      <p>Cronograma de parcelas e limite disponível</p>
    </div>
    <div class="chev">›</div>
  </a>

  <a class="card gastos" href="gastos.html">
    <div class="emoji">📊</div>
    <div>
      <h2>Gastos Gerais</h2>
      <p>Despesas do dia a dia, agrupadas por categoria</p>
    </div>
    <div class="chev">›</div>
  </a>
</div>
</body>
</html>
